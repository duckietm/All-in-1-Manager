name: CI

# Tests and builds the installer on Windows and Linux on every pull request and push to main, and keeps the
# release binaries as workflow artifacts.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-windows-x64
          path: target/release/all-in-1-manager.exe

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        # The runner's network sometimes cannot resolve the Ubuntu mirrors for a moment: retry each download, and
        # the whole step up to three times, before failing.
        run: |
          ok=
          for try in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev; then
              ok=yes
              break
            fi
            echo "apt-get failed (try $try of 3), trying again in 20 seconds"
            sleep 20
          done
          [ -n "$ok" ] || { echo "The system libraries could not be installed"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      # Linux only: the lints do not depend on the platform, and the Windows job already carries the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-linux-x64
          path: target/release/all-in-1-manager
