name: CI

# Tests and builds the installer on Windows and Linux on every pull request and push to main, and keeps the
# release binaries as workflow artifacts.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # pack_plugin.py's bytes are those of stock zlib: Python 3.13 (3.14+ on Windows is built on zlib-ng).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-windows-x64
          path: target/release/all-in-1-manager.exe

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      # pack_plugin.py's bytes are those of stock zlib: Python 3.13 (3.14+ on Windows is built on zlib-ng).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      # Linux only: the lints do not depend on the platform, and the Windows job already carries the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-linux-x64
          path: target/release/all-in-1-manager

  # The plugin guest workspace (source/plugins: the SDK and the example plugins) is excluded from the main
  # workspace, so the jobs above do not build it. It is built for wasm32-wasip2; the SDK's native tests
  # (out_of_tree.rs, guide_samples.rs) build throwaway plugins for that target and need the network or a warm cache.
  plugins:
    name: Plugin SDK and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            source/plugins
      - name: Fetch guest dependencies
        working-directory: source/plugins
        run: cargo fetch --locked
      - name: Build the SDK and examples (wasm32-wasip2)
        working-directory: source/plugins
        run: cargo build --target wasm32-wasip2 --release --locked
      - name: Clippy (wasm32-wasip2)
        working-directory: source/plugins
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
      - name: SDK tests
        working-directory: source/plugins
        run: cargo test -p aio-plugin-sdk
      - name: Build the aio-plugin tool
        run: cargo build --release -p aio-plugin-cli
      - name: Pack and check the examples
        run: |
          tool="$GITHUB_WORKSPACE/target/release/aio-plugin"
          for example in hello notes; do
            (cd "source/plugins/$example" && "$tool" pack --locked && "$tool" check dist/*.aiop)
          done

  # The SDK promises `rust-version = "1.88"` (source/plugins/sdk/Cargo.toml): build it and the examples with exactly
  # that toolchain, so a newer language or library feature cannot slip in.
  plugins-msrv:
    name: Plugin SDK on Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/plugins
          key: msrv-1.88
      - name: Build the SDK and examples with Rust 1.88 (wasm32-wasip2)
        working-directory: source/plugins
        run: cargo build --target wasm32-wasip2 --locked -p aio-plugin-sdk -p hello -p notes
