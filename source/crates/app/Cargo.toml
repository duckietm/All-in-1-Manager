[package]
name = "aio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "All-in-1 Manager: sets up a full hotel server (Polaris, Octane, MariaDB, NGINX, Traefik) over SSH"
build = "build.rs"

[[bin]]
name = "all-in-1-manager"
path = "src/main.rs"

[dependencies]
aio-assets.workspace = true
aio-catalog-rip.workspace = true
aio-core.workspace = true
aio-remote.workspace = true
aio-terminal.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
reqwest.workspace = true
eframe.workspace = true
egui_extras = { workspace = true, features = ["svg", "image"] }
image.workspace = true
rfd.workspace = true
sys-locale.workspace = true
zip.workspace = true

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
