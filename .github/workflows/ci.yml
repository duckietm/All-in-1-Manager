name: CI

# Tests and builds the installer on Windows and Linux on every pull request and push to main, and keeps the
# release binaries as workflow artifacts.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # pack_plugin.py's bytes are those of stock zlib: Python 3.13 (3.14+ on Windows is built on zlib-ng).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-windows-x64
          path: target/release/all-in-1-manager.exe

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      # pack_plugin.py's bytes are those of stock zlib: Python 3.13 (3.14+ on Windows is built on zlib-ng).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      # Linux only: the lints do not depend on the platform, and the Windows job already carries the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-linux-x64
          path: target/release/all-in-1-manager
