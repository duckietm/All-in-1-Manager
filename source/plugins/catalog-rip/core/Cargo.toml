[package]
name = "catalog-rip-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Catalogue ripper core: the pure, I/O-free parsers and exporters (packets, profiles, SQL and JSON export)"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
