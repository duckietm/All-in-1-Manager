name: Release

# Every push to main publishes a release with the Windows and Linux binaries, and the version goes up by itself:
#   - the version in Cargo.toml has no release yet (you set it yourself, e.g. 2.1.0): that version is released;
#   - it already has one: the last number goes up (2.0.3 -> 2.0.4, with source/tools/version.py --next), the bot
#     commits "Version 2.0.4" to main, and that is released.
# The tag rust-v<version> is made on the released commit. Pushes that only change the README, the licence or
# public/docs release nothing. The installer's update check at startup looks for exactly these tags and file names.
#
# A tag rust-v<version> pushed by hand (it must match Cargo.toml) or "Run workflow" on the Actions page also release.

on:
  push:
    branches: [main]
    tags: ["rust-v*"]
    paths-ignore: ["README.md", "LICENSE", "public/docs/**"]
  workflow_dispatch:

# One release at a time: a push that arrives meanwhile waits and then releases what main has by then.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The newest main (a run that waited may find the bot's version commit there), with the tags.
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 source/tools/version.py)
          released() { gh release view "rust-v$1" --repo "${{ github.repository }}" >/dev/null 2>&1; }
          if [ "${{ github.ref_type }}" = "tag" ]; then
            if [ "${{ github.ref_name }}" != "rust-v$version" ]; then
              echo "::error::Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
              exit 1
            fi
            if released "$version"; then release=false; else release=true; fi
          elif ! released "$version"; then
            echo "rust-v$version has no release yet: releasing it."
            release=true
          elif [ "$(git rev-parse "rust-v$version^{commit}" 2>/dev/null)" = "$(git rev-parse HEAD)" ]; then
            echo "main is rust-v$version already: nothing new to release."
            release=false
          else
            version=$(python3 source/tools/version.py --next)
            echo "Raising the version to $version."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -am "Version $version"
            git push origin HEAD:main
            release=true
          fi
          echo "tag=rust-v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p aio-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/all-in-1-manager.exe out/all-in-1-manager-windows-x64.exe
          # The name versions before the rename look for when they check for updates.
          Copy-Item target/release/all-in-1-manager.exe out/all-in-1-installer-windows-x64.exe
          # What the update check compares the download against before it replaces the running program.
          (Get-FileHash out/all-in-1-manager-windows-x64.exe -Algorithm SHA256).Hash.ToLower() `
            | Set-Content -NoNewline out/all-in-1-manager-windows-x64.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  linux:
    name: Linux x64
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p aio-app
      - name: Package
        run: |
          mkdir -p out
          cp target/release/all-in-1-manager out/all-in-1-manager-linux-x64
          # The name versions before the rename look for when they check for updates.
          cp target/release/all-in-1-manager out/all-in-1-installer-linux-x64
          # What the update check compares the download against before it replaces the running program.
          sha256sum out/all-in-1-manager-linux-x64 | cut -d' ' -f1 > out/all-in-1-manager-linux-x64.sha256
          # The data packs of the Plugins page (client images, default catalogue), with their .sha256: the program
          # downloads them on demand instead of carrying them.
          python3 source/tools/make_packs.py out/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/

  release:
    name: Publish release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The tag is made on the released commit when it does not exist yet.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: All-in-1 Manager ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/all-in-1-manager-windows-x64.exe
            dist/all-in-1-manager-linux-x64
            dist/all-in-1-installer-windows-x64.exe
            dist/all-in-1-installer-linux-x64
            dist/all-in-1-manager-windows-x64.exe.sha256
            dist/all-in-1-manager-linux-x64.sha256
            dist/plugin-client-assets.zip
            dist/plugin-client-assets.zip.sha256
            dist/plugin-default-catalog.zip
            dist/plugin-default-catalog.zip.sha256
