[package]
name = "hello"
version = "1.0.0"
edition = "2021"
publish = false
description = "Example All-in-1 Manager plugin: a greeting form with a persisted counter"

[lib]
# A component is a cdylib built for wasm32-wasip2.
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[features]
# Test-only variants used by the host's sandbox tests. The default build has none of them.
# `render` never returns (the host must interrupt it after 5 s).
runaway = []
# `render` allocates and touches 80 MiB (the host limits memory to 64 MiB).
hog = []
# `render` sleeps for an hour in a WASI clock wait (the host must interrupt it after 5 s).
sleeper = []
# `render` first asks the user a question (the time the user takes does not count).
asker = []
# `render` first runs a script on the server (permission `ssh`; waits for the user's approval).
scripter = []
