name: CI

# Tests and builds the installer on Windows and Linux on every pull request and push to main, and keeps the
# release binaries as workflow artifacts.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-windows-x64
          path: target/release/all-in-1-manager.exe

  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p aio-app
      - uses: actions/upload-artifact@v4
        with:
          name: all-in-1-manager-linux-x64
          path: target/release/all-in-1-manager
