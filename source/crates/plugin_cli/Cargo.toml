[package]
name = "aio-plugin-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "All-in-1 Manager: aio-plugin, the plugin authors' tool (new, build, pack, check, dev)"

[[bin]]
name = "aio-plugin"
path = "src/main.rs"

[dependencies]
aio-plugin-host.workspace = true
anyhow.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The C zlib backend, stock zlib built from source (static), never the system's (which may be zlib-ng): its
# level 9 deflate gives the same bytes as Python's stock zlib, so `pack` matches source/tools/pack_plugin.py
# byte for byte (the test `pack_matches_pack_plugin_py` checks it).
flate2 = { workspace = true, features = ["zlib"] }
libz-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
